<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#02040a" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%2302040a%22/><circle cx=%2216%22 cy=%2216%22 r=%2210%22 fill=%22none%22 stroke=%22%23c9d8f5%22 stroke-width=%221.6%22/><line x1=%2216%22 y1=%226%22 x2=%2216%22 y2=%2226%22 stroke=%22%23c9d8f5%22 stroke-width=%221.4%22 stroke-dasharray=%221.6 2%22/><circle cx=%2216%22 cy=%226%22 r=%222.6%22 fill=%22%23f5c86a%22/><circle cx=%2216%22 cy=%2226%22 r=%222.6%22 fill=%22%237fe3f2%22/></svg>" />
    <meta
      name="description"
      content="Explore o planeta, escolha um ponto e descubra onde uma linha através da Terra chegaria."
    />
    <title>Terra Através</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Critical entry-screen styles: painted before the JavaScript bundle arrives. -->
    <style>
      html, body { margin: 0; height: 100%; background: #02040a; color-scheme: dark; }
      .boot-screen {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: #eef3ff;
        font-family: Manrope, "Segoe UI", system-ui, sans-serif;
        background: radial-gradient(ellipse 70% 60% at 50% 46%, #0b1830 0%, #050b16 48%, #02040a 100%);
        opacity: 1;
        transition: opacity 500ms ease;
      }
      .boot-screen::before,
      .space-backdrop::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image:
          radial-gradient(1px 1px at 7% 12%, rgb(255 255 255 / 0.65), transparent 70%),
          radial-gradient(1px 1px at 23% 67%, rgb(214 228 255 / 0.5), transparent 70%),
          radial-gradient(1px 1px at 41% 31%, rgb(255 255 255 / 0.45), transparent 70%),
          radial-gradient(1px 1px at 58% 83%, rgb(255 255 255 / 0.55), transparent 70%),
          radial-gradient(1px 1px at 76% 22%, rgb(214 228 255 / 0.5), transparent 70%),
          radial-gradient(1px 1px at 91% 58%, rgb(255 255 255 / 0.4), transparent 70%),
          radial-gradient(1px 1px at 15% 91%, rgb(255 255 255 / 0.35), transparent 70%),
          radial-gradient(1px 1px at 67% 49%, rgb(214 228 255 / 0.3), transparent 70%),
          radial-gradient(1px 1px at 33% 8%, rgb(255 255 255 / 0.4), transparent 70%),
          radial-gradient(1px 1px at 84% 94%, rgb(255 255 255 / 0.35), transparent 70%);
        background-size: 283px 283px, 283px 283px, 283px 283px, 283px 283px, 283px 283px,
          419px 419px, 419px 419px, 419px 419px, 419px 419px, 419px 419px;
        opacity: 0.7;
      }
      .boot-screen::after,
      .space-backdrop::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image:
          radial-gradient(1.4px 1.4px at 18% 38%, rgb(255 255 255 / 0.8), transparent 70%),
          radial-gradient(1.4px 1.4px at 62% 14%, rgb(226 236 255 / 0.7), transparent 70%),
          radial-gradient(1.4px 1.4px at 88% 71%, rgb(255 255 255 / 0.6), transparent 70%),
          radial-gradient(1.2px 1.2px at 39% 86%, rgb(255 244 224 / 0.6), transparent 70%);
        background-size: 733px 733px;
        opacity: 0.55;
      }
      .boot-screen--leaving { opacity: 0; pointer-events: none; }
      .boot-screen__content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 24px;
      }
      .boot-screen__glyph { width: 44px; height: 44px; color: #c9d8f5; }
      .boot-screen__title {
        margin: 22px 0 0;
        padding-left: 0.42em;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.42em;
        text-transform: uppercase;
      }
      .boot-screen__status {
        position: relative;
        margin: 14px 0 0;
        padding-bottom: 14px;
        font-size: 12px;
        letter-spacing: 0.04em;
        color: rgb(215 226 245 / 0.62);
      }
      .boot-screen__status::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: 0;
        width: 56px;
        height: 1px;
        margin-left: -28px;
        background: linear-gradient(90deg, transparent, rgb(201 216 245 / 0.75), transparent);
        background-size: 200% 100%;
        animation: boot-scan 1.6s ease-in-out infinite;
      }
      @keyframes boot-scan {
        from { background-position: 100% 0; }
        to { background-position: -100% 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-screen { transition-duration: 1ms; }
        .boot-screen__status::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen" data-testid="loading-screen" data-status="initializing">
        <div class="boot-screen__content">
          <svg class="boot-screen__glyph" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
            <circle cx="16" cy="16" r="11.5" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.2" />
            <ellipse cx="16" cy="16" rx="11.5" ry="4" fill="none" stroke="currentColor" stroke-opacity="0.2" stroke-width="1" />
            <line x1="16" y1="4.5" x2="16" y2="27.5" stroke="currentColor" stroke-width="1.2" stroke-dasharray="1.5 2.2" />
            <circle cx="16" cy="4.5" r="2.2" fill="#f5c86a" />
            <circle cx="16" cy="27.5" r="2.2" fill="#7fe3f2" />
          </svg>
          <p class="boot-screen__title">Terra Através</p>
          <p class="boot-screen__status" role="status" aria-live="polite">Inicializando globo…</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
